<section id="shop" class="bg-cream-50 py-16 md:py-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-xl mx-auto mb-10 md:mb-14">
      <span class="eyebrow">Explore Our Collections</span>
      <h2 class="font-serif text-3xl md:text-4xl mt-3 text-ink-900">Shop by Category</h2>
      <p class="text-ink-800/60 text-sm mt-3">Timeless pieces for every moment.</p>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4 md:gap-6">
      <a *ngFor="let cat of categories" routerLink="/collections" [queryParams]="{ category: cat.slug }"
         class="group flex flex-col items-center text-center">
        <div class="w-full aspect-square rounded-sm overflow-hidden shadow-card group-hover:shadow-soft transition-shadow">
          <img [src]="cat.image" [alt]="cat.name" loading="lazy"
               class="block w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        </div>
        <span class="mt-3 text-sm font-medium text-ink-900">{{ cat.name }}</span>
        <span class="text-xs text-gold-400 mt-0.5 flex items-center gap-1">
          Shop Now
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
      </a>
    </div>

    <!-- perks strip -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 md:gap-8 mt-14 pt-10 border-t border-gold-100">
      <div *ngFor="let perk of perks" class="flex items-center gap-4 justify-center sm:justify-start">
        <div class="w-11 h-11 shrink-0 rounded-full bg-gold-50 flex items-center justify-center text-gold-400">
          <svg *ngIf="perk.icon === 'gem'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M8 3l4 6-4 12M16 3l-4 6 4 12"/></svg>
          <svg *ngIf="perk.icon === 'lock'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          <svg *ngIf="perk.icon === 'truck'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="6" width="14" height="11"/><path d="M15 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17.5" cy="19" r="1.6"/></svg>
        </div>
        <div>
          <p class="text-sm font-medium text-ink-900">{{ perk.title }}</p>
          <p class="text-xs text-ink-800/60">{{ perk.subtitle }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
