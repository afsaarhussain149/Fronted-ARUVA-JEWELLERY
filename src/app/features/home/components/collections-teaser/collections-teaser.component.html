<section class="bg-cream-50 py-16 md:py-20 relative">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-xl mx-auto mb-10 md:mb-14">
      <span class="eyebrow">Special Collections</span>
      <h2 class="font-serif text-3xl md:text-4xl mt-3 text-ink-900">Curated Collections for Every You</h2>
      <p class="text-ink-800/60 text-sm mt-3">From everyday elegance to once-in-a-lifetime moments.</p>
    </div>

    <div class="grid sm:grid-cols-3 gap-5 md:gap-6">
      <a *ngFor="let c of collections" routerLink="/collections" class="group block">
        <div class="aspect-[4/5] rounded-sm overflow-hidden shadow-card group-hover:shadow-soft transition-shadow">
          <img [src]="c.image" [alt]="c.name" loading="lazy" class="block w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
        </div>
        <div class="mt-3">
          <h3 class="font-serif text-lg text-ink-900">{{ c.name }}</h3>
          <p class="text-xs text-ink-800/55 mt-1">{{ c.tags }}</p>
          <span class="text-xs text-gold-500 mt-1 inline-flex items-center gap-1">
            Shop Now
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
        </div>
      </a>
    </div>

    <div class="flex justify-center mt-10">
      <a routerLink="/collections" class="btn-outline">View All Collections</a>
    </div>
  </div>
</section>
