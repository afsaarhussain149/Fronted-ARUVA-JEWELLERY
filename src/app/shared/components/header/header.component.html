<header
  class="sticky top-0 z-50 bg-cream-50/95 backdrop-blur border-b border-gold-100 transition-shadow"
  [class.shadow-soft]="scrolled()"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">

      <!-- Logo -->
      <a routerLink="/" (click)="closeMenu()" class="flex flex-col items-center leading-none shrink-0">
        <span class="font-serif text-xl md:text-2xl tracking-[0.15em] text-ink-900">ARUVA</span>
        <span class="text-[9px] md:text-[10px] tracking-[0.4em] text-gold-400 -mt-0.5">JEWELLERY</span>
      </a>

      <!-- Desktop nav -->
      <nav class="hidden md:flex items-center gap-9">
        <a *ngFor="let item of navLinks"
           [routerLink]="item.link"
           [fragment]="item.fragment"
           routerLinkActive="text-gold-500"
           [routerLinkActiveOptions]="{ exact: true }"
           class="text-sm tracking-wide text-ink-800 hover:text-gold-400 transition-colors">
          {{ item.label }}
        </a>
      </nav>

      <!-- Icons -->
      <div class="flex items-center gap-4 md:gap-5 text-ink-900">
        <!-- <button class="hidden sm:inline-flex hover:text-gold-400 transition-colors" aria-label="Search">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="hidden sm:inline-flex hover:text-gold-400 transition-colors" aria-label="Account">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        </button>
        <button class="hidden sm:inline-flex hover:text-gold-400 transition-colors" aria-label="Wishlist">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.9.5 5 2.2C11.7 4.6 13.6 3.7 15.6 4.1c3.2.7 4.6 3.9 2.9 7.1C19.7 15.6 12 20 12 20z"/></svg>
        </button>
        <button class="relative hover:text-gold-400 transition-colors" aria-label="Bag">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>
          <span class="absolute -top-2 -right-2 bg-gold-400 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">2</span>
        </button> -->

        <!-- Mobile hamburger -->
        <button class="md:hidden inline-flex hover:text-gold-400 transition-colors" (click)="toggleMenu()" aria-label="Menu">
          <svg *ngIf="!menuOpen()" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <svg *ngIf="menuOpen()" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu panel -->
  <div
    class="md:hidden overflow-hidden transition-all duration-300 ease-in-out bg-cream-50 border-t border-gold-100"
    [style.maxHeight]="menuOpen() ? '360px' : '0px'"
  >
    <nav class="flex flex-col px-6 py-4 gap-4">
      <a *ngFor="let item of navLinks"
         [routerLink]="item.link"
         [fragment]="item.fragment"
         (click)="closeMenu()"
         class="text-sm tracking-wide text-ink-800 py-1 border-b border-cream-200">
        {{ item.label }}
      </a>
      <div class="flex items-center gap-6 pt-2 text-ink-800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-9.3-8.8C1 8 2.4 4.8 5.6 4.1c2-.4 3.9.5 5 2.2C11.7 4.6 13.6 3.7 15.6 4.1c3.2.7 4.6 3.9 2.9 7.1C19.7 15.6 12 20 12 20z"/></svg>
      </div>
    </nav>
  </div>
</header>
